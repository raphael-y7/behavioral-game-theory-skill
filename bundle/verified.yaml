    title: 讨价还价结果预测
    importance: medium
    importance_rationale: 对应 task-09（coverage-audit 无缺口）；deal-me-out 判据有干净实验裁定（f228/p245/p246 等 20+ verified），与 social-preference 卡触发相邻降为 router
    one_liner: 结果落在"均分↔精炼预测"区间；外部选择低于 δ/(1+δ)×饼则出局（deal-me-out）
    intents: [预测谈判落点, 判断BATNA重要性, 设计谈判时序, bargaining prediction, BATNA]
    keywords: [讨价还价, 谈判, 外部选择, 贴现因子, deal-me-out, 僵局, bargaining]
    also_read: [cap.behavioral-game-theory.social-preference-measure, cap.behavioral-game-theory.model-recipe-selection]
    card: cards/bargaining-prediction.md
    frontmatter:
      description: |
        当问题是"这场谈判会落在哪"时使用：先算轮流出价 SPE（δ/(1+δ)），再套外部选择三分法（<δ/(1+δ)×饼→deal-me-out 出局；高且威胁可信→计入；外生强制→例外），最后行为修正为"均分↔精炼"区间（公平偏好拉向均分、截止期效应、两轮截断启发式、自利偏向双向错位）。语言信号：能谈到多少、BATNA、筹码、会谈崩吗。不适用于：零和投机盘（无谈判伙伴）、公平效用的具体计算（归社会偏好卡）。译本 δ/(1−δ) 为排印错误一律用 δ/(1+δ)。trigger: bargaining, 谈判预测, deal-me-out.
      tags: [decision, negotiation]
