schema_version: 1
bundle_id: bundle.behavioral-game-theory
book:
  title: 行为博弈：对策略互动的实验研究
  author: 〔美〕科林·凯莫勒（Colin F. Camerer）著，贺京同等译
  source_pack: 行为博弈_合并转写稿.md
  baseline_tag: behavioral-game-theory
entry:
  name: behavioral-game-theory-skill
  description: 用行为博弈论的实验结论与可计算模型分析策略互动问题（含股票投资场景中的对手行为、公司信号、拥挤与共识）。涵盖：社会性偏好测度与FS/互惠计算、认知等级与首轮行为预测（CH/QRE）、EWA学习建模、协调博弈均衡筛选（聚点/风险占优）、信号传递判读（含企业融资）、市场进入与拥挤、声誉机制、讨价还价预测、行为研究方法论审计。以第9章"模型选型菜谱"为总路由。
  core_principles:
    - 自利是特例：他人所得真实进入效用函数，可用 FS(α,β) 或互惠模型参数化
    - 人是"一步半的思考者"：首轮行为由泊松认知等级(τ≈1.5)主导，QRE 给理性程度定价
    - 均衡概念对动态零解释力：重复互动的演化用 EWA/fEWA 更新规则建模
    - 多重均衡的筛选有可辨识原则：三分类（匹配/猎鹿/性别战）+ 聚点 + 风险占优度量
    - 信号的价值在成本不对称；弱精炼够用，强精炼在数据面前失灵
    - 修正而非抛弃：保留策略互动框架，替换自利/无限推理/静态均衡三个假设
    - 默认参数是"零卡路里菜谱"（FS α=1/3、CH τ=1.5、fEWA λ=1），换场景必须重估
  out_of_scope:
    - 单人不涉及策略互动的普通决策与心理自助
    - 已由长期市场选择充分塑造的稳态价格预测（实验室规律外推边界）
    - 纯技术分析、财务报表分析与估值建模（非本书主题）
    - 统计审查（样本量、功效、多重比较——原书未覆盖的方法论纪律）
  stop_conditions:
    - 问题不含策略互动（对手反应不影响结果）时停止并说明
    - 缺少关键结构参数（支付/容量/贴现因子/类型先验）且用户无法提供时，输出定性方向并声明缺口，不得臆造数值
    - 需要逐笔投资建议时停止——本技能提供行为分析视角，不构成投资建议
router_entry:
  name: behavioral-game-theory-skill-router
  description: 行为博弈论能力路由入口：按问题类型（社会性偏好/首轮行为/学习演化/均衡筛选/信号/声誉/进入/谈判/研究审计）定位到对应能力卡执行；未晋级能力（声誉机制、讨价还价预测、研究审计）经此入口访问。
promotion_budget: 8
